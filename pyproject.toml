[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telecompass"
dynamic = ["version"]
description = "Telehealth visit preflight: is this visit allowed and payable on a given date."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.165.0",
    "httpx>=0.29.0",
    "langfuse>=5.2.0",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.2.1",
    "lxml>=6.1.3",
    "olefile>=0.47",
    "openai>=3.60.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pypdf>=7.2.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "testcontainers>=4.15.0",
]

[tool.hatch.version]
path = "telecompass/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["telecompass"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["telecompass", "fakes", "test_preflight", "test_change_agent"]

[tool.ruff.lint.per-file-ignores]
# The local review pages build their HTML and CSS inline; those lines run a little long.
"telecompass/approve_app.py" = ["E501"]
"telecompass/change_pages.py" = ["E501"]
