[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telecompass"
dynamic = ["version"]
description = "Telehealth visit preflight: is this visit allowed and payable on a given date."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.version]
path = "telecompass/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["telecompass"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
