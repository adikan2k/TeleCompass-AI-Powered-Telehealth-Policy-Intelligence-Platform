# Official copies of documents whose cited link we may not fetch, or could not reach (D7).
#
# CCHP cites some Florida documents through sites whose robots.txt forbids fetching. Where the
# same document is published on an official site, it is listed here as a PROPOSAL.
#
# An entry is IGNORED until a person has opened both links, seen that they are the same
# document, and filled in `confirmed_by` and `confirmed_on`. Nothing else may fill them in.
# The candidates below were found by a web search on 2026-11-26. None is confirmed.
#
# Searched for and NOT found on any official site (the agency's own archive links these three
# alerts to the same email-archive service, so there may be no official copy):
#   - Florida Medicaid alert, "Ending of Federal Public Health Emergency: Updated Co-Payment and
#     Telemedicine Guidance for Medical and Behavioral Health Providers", May 4, 2023
#   - Florida Medicaid alert, "Community Behavioral Health Telemedicine-Eligible Services",
#     May 12, 2023
#   - Florida Medicaid alert, "Florida Medicaid Reimbursement for Acute Hospital Care at Home
#     Program", November 14, 2024

